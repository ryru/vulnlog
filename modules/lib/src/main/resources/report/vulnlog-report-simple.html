<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vulnerability impact report, generated by Vulnlog.">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
    <title>Vulnlog report</title>
    <style>
        /*
         * The report is one file that works offline: it loads no fonts, images, or scripts.
         * It opens in browsers the team doesn't choose, so the CSS avoids recent features such as
         * nesting and light-dark(). Colours, shapes, and type: devdoc/Brand.adoc.
         *
         * Sizes: 0.875, 1, 1.5, and 2rem. Spacing: 0.25, 0.5, 0.75, 1, 1.5, 2, and 3rem.
         */
        :root {
            color-scheme: light dark;

            --bg: #fafbfc;
            --surface: #f1f3f5;
            --border: #d9dee3;
            --text: #1f2630;
            --text-soft: #59636e;
            --brand: #d32f6a;

            /* The same in both themes. */
            --critical: #d63a24;
            --high: #d97a0a;
            --medium: #c9a00d;
            --low: #3b7fc4;
            --positive: #3f9a63;
            --accepted: #7f79b8;
            --muted: #7f8a94;

            --radius: 6px;
            --font-mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161b22;
                --surface: #1e242c;
                --border: #313943;
                --text: #e3e8ee;
                --text-soft: #9aa5b1;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* Rules that set display must not bring a hidden element back. */
        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        h1, h2, h3, p, dl, dd {
            margin: 0;
        }

        /* One bold weight for the whole report. */
        h1, h2, h3, b, th {
            font-weight: 600;
        }

        a {
            color: var(--brand);
            text-underline-offset: 2px;
        }

        button {
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        :focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 2px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            padding: 0.5rem 1rem;
            background: var(--text);
            color: var(--bg);
        }

        .skip-link:focus {
            left: 0;
        }

        .page {
            max-width: 80rem;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* ===== Heading ===== */
        .report-header {
            padding: 3rem 0 2rem;
        }

        .kicker {
            color: var(--text-soft);
            font-size: 0.875rem;
        }

        h1 {
            font-size: 2rem;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }

        .byline {
            display: flex;
            flex-wrap: wrap;
            gap: 0 0.75rem;
            color: var(--text-soft);
        }

        .byline span + span {
            padding-left: 0.75rem;
            border-left: 1px solid var(--border);
        }

        /* What the report covers: quiet when it shows everything, set apart when a filter leaves entries out. */
        .source {
            margin-top: 0.75rem;
            color: var(--text-soft);
        }

        .source .filtered {
            color: var(--text);
        }

        /*
         * ===== Summary: two stacked bars =====
         * The bars give the proportions at a glance. The legend below each bar carries the numbers,
         * because a segment of 1 in 29 is too narrow to hold one. A legend item also filters the table.
         */
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
            gap: 1.5rem 3rem;
        }

        .summary h3 {
            margin-bottom: 0.5rem;
            color: var(--text-soft);
            font-size: 1rem;
        }

        .summary h3 b {
            margin-right: 0.25rem;
            color: var(--text);
            font-size: 1.5rem;
        }

        .stack {
            display: flex;
            gap: 2px;
            height: 0.75rem;
            overflow: hidden;
            border-radius: 1rem;
            background: var(--surface);
        }

        .stack span {
            min-width: 3px;
            background: var(--tone, transparent);
            box-shadow: inset 0 0 0 1px var(--tone, var(--text-soft));
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin: 0.25rem 0 0 -0.5rem;
        }

        .key {
            padding: 0 0.5rem;
            border-radius: var(--radius);
        }

        .key:hover:not(:disabled) {
            background: var(--surface);
        }

        .key[aria-pressed="true"] {
            background: var(--surface);
            box-shadow: inset 0 0 0 1px var(--text-soft);
        }

        .key:disabled {
            color: var(--text-soft);
            cursor: default;
        }

        .key:disabled b {
            font-weight: 400;
        }

        /*
         * ===== Toolbar: filters and views =====
         * Its two lines are always there, so a filter never moves the table.
         */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem 1.5rem;
            margin-top: 2rem;
        }

        .toolbar label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-soft);
        }

        select {
            padding: 0.25rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }

        .views {
            display: flex;
            gap: 1.5rem;
            margin-left: auto;
        }

        .showing {
            display: flex;
            flex-basis: 100%;
            gap: 1rem;
        }

        .text-button {
            color: var(--brand);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .invisible {
            visibility: hidden;
        }

        /*
         * A tone is the colour of a state or a severity. An element with data-tone sets it, and the
         * bar of a row, the segments, and the dots inside the element use it. Without a tone, a dot is a ring.
         */
        [data-tone="open"] { --tone: var(--text); }
        [data-tone="critical"] { --tone: var(--critical); }
        [data-tone="high"] { --tone: var(--high); }
        [data-tone="medium"] { --tone: var(--medium); }
        [data-tone="low"] { --tone: var(--low); }
        [data-tone="positive"] { --tone: var(--positive); }
        [data-tone="accepted"] { --tone: var(--accepted); }
        [data-tone="muted"] { --tone: var(--muted); }

        .dot {
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            margin-right: 0.5rem;
            border: 1px solid var(--tone, var(--text-soft));
            border-radius: 50%;
            background: var(--tone, transparent);
        }

        /* ===== Table ===== */
        table {
            width: 100%;
            margin: 1rem 0 2rem;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .col-ids { width: 13rem; }
        .col-state { width: 10rem; }
        .col-releases { width: 10rem; }

        th, td {
            padding: 0.75rem;
            text-align: left;
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        td {
            border-bottom: 1px solid var(--border);
        }

        /* The column headings stay in view in a long report. A shadow draws their line, because a border scrolls away. */
        th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--bg);
            box-shadow: inset 0 -1px 0 var(--border);
            color: var(--text-soft);
        }

        /* The bar on the left edge of a row. */
        tbody td:first-child {
            border-left: 4px solid var(--tone, transparent);
        }

        tbody tr:hover {
            background: var(--surface);
        }

        .ids {
            font-family: var(--font-mono);
            font-size: 0.875rem;
        }

        .ids a {
            display: block;
            width: fit-content;
            color: inherit;
            text-decoration-color: var(--border);
        }

        .ids a:hover {
            color: var(--brand);
            text-decoration-color: currentColor;
        }

        .ids .alias {
            color: var(--text-soft);
        }

        .badge {
            display: inline-block;
            padding: 0 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.875rem;
            line-height: 1.5rem;
            white-space: nowrap;
        }

        .details > * + * {
            margin-top: 0.5rem;
        }

        /* "Affected / High severity / Will fix" in one line. */
        .assessment span + span::before {
            content: "/";
            margin: 0 0.5rem;
            color: var(--border);
        }

        .label {
            margin-right: 0.5rem;
            color: var(--text-soft);
        }

        /* Long analyses show three lines until the reader asks for more. */
        .folded {
            display: -webkit-box;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            line-clamp: 3;
        }

        /*
         * Collapsed: one line per entry with the primary ID, the state, the first line of the details,
         * and the releases.
         */
        .compact .alias,
        .compact .details > :not(:first-child),
        .compact .fixed {
            display: none;
        }

        .compact .details > :first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .compact td {
            padding-block: 0.5rem;
        }

        .compact td:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fixed {
            margin-top: 0.25rem;
            color: var(--text-soft);
            font-size: 0.875rem;
        }

        .empty {
            padding: 3rem 0.75rem;
            color: var(--text-soft);
            text-align: center;
        }

        /* ===== Footer ===== */
        .report-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 0 2rem;
            color: var(--text-soft);
            font-size: 0.875rem;
        }

        .report-footer a {
            display: flex;
            color: inherit;
        }

        .report-footer svg {
            height: 1rem;
        }

        /* ===== Narrow screens: each row becomes a block, because four columns don't fit ===== */
        @media (max-width: 45rem) {
            table, tbody, tr, td {
                display: block;
            }

            thead {
                display: none;
            }

            tbody tr {
                padding: 0.75rem 0 0.75rem 0.75rem;
                border-bottom: 1px solid var(--border);
                border-left: 4px solid var(--tone, transparent);
            }

            tbody td, tbody td:first-child {
                padding: 0.25rem 0;
                border: 0;
            }

            td[data-label]::before {
                content: attr(data-label);
                margin-right: 0.5rem;
                color: var(--text-soft);
            }

            .fixed {
                display: inline;
                margin-left: 0.75rem;
            }

            .byline {
                flex-direction: column;
            }

            .byline span + span {
                padding-left: 0;
                border-left: 0;
            }
        }

        /* ===== Print ===== */
        @page {
            size: A4;
            margin: 1.2cm;
        }

        @media print {
            :root {
                color-scheme: light;
                /* Every size is in rem, so this one value scales the report for paper. */
                font-size: 9pt;
                --bg: #ffffff;
                --surface: #ffffff;
                --border: #888888;
                --text: #000000;
                --text-soft: #333333;
            }

            body {
                /* Keeps the bars and dots, which browsers otherwise drop as background graphics. */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* Paper keeps the sentence that says what the table shows, without the controls. */
            .skip-link, .more, .toolbar label, .views, .text-button {
                display: none;
            }

            .page {
                padding: 0;
            }

            .report-header {
                padding-top: 0;
            }

            /* On paper the grey background is gone, so a line sets these apart. */
            .key[aria-pressed="true"] {
                box-shadow: inset 0 0 0 1px var(--border);
            }

            .folded {
                display: block;
            }

            th {
                position: static;
                background: none;
                box-shadow: none;
                border-bottom: 1px solid var(--border);
            }

            /* Repeats the column headings on every page. */
            thead {
                display: table-header-group;
            }

            tr {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
<a class="skip-link" href="#entries">Skip to the vulnerabilities</a>

<div class="page">
    <header class="report-header">
        <p class="kicker">Vulnerability Impact Report</p>
        <h1 id="project-name"></h1>
        <p class="byline" id="byline"></p>
        <p class="source" id="source"></p>
    </header>

    <main>
        <section class="summary" aria-labelledby="summary-heading">
            <h2 class="visually-hidden" id="summary-heading">Summary</h2>
            <div>
                <h3><b id="open-count"></b> open, by severity</h3>
                <div class="stack" id="open-stack" role="img"></div>
                <p class="legend" id="open-legend"></p>
            </div>
            <div>
                <h3><b id="total"></b> entries, by state</h3>
                <div class="stack" id="state-stack" role="img"></div>
                <p class="legend" id="state-legend"></p>
            </div>
        </section>

        <section aria-labelledby="entries-heading">
            <h2 class="visually-hidden" id="entries-heading">Vulnerabilities</h2>
            <div class="toolbar">
                <label>Affects <select id="pick-release"><option value="">Any release</option></select></label>
                <label>Fixed in <select id="pick-fixed-in"><option value="">Any release</option></select></label>
                <label>Disposition <select id="pick-disposition"><option value="">Any</option></select></label>
                <div class="views">
                    <button class="text-button" id="collapse-all" type="button">Collapse all</button>
                    <button class="text-button" id="expand-all" type="button">Expand all</button>
                </div>
                <p class="showing">
                    <span id="showing" role="status"></span>
                    <button class="text-button invisible" id="clear" type="button">Clear filters</button>
                </p>
            </div>
            <table id="entries">
                <colgroup>
                    <col class="col-ids">
                    <col class="col-state">
                    <col>
                    <col class="col-releases">
                </colgroup>
                <thead>
                <tr>
                    <th scope="col">IDs</th>
                    <th scope="col">State</th>
                    <th scope="col">Details</th>
                    <th scope="col">Releases</th>
                </tr>
                </thead>
                <tbody id="entry-rows"></tbody>
            </table>
        </section>
    </main>

    <footer class="report-footer">
        <span>Generated by</span>
        <a aria-label="Vulnlog website" href="https://vulnlog.dev">
            <svg aria-hidden="true" focusable="false" viewBox="-12 0 674 200" xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor" fill-rule="evenodd" d="M614 150Q614 168 603 181Q592 195 575 199Q558 203 542 195Q526 187 519 171L517 167Q516 165 517 163Q517 161 519 160L528 156Q530 155 532 156Q534 157 535 159L537 163Q541 172 551 177Q560 182 570 179Q581 177 587 169Q594 161 594 150L594 140Q581 150 564 150Q543 150 529 135Q514 121 514 100Q514 79 529 65Q543 50 564 50Q581 50 594 60L594 56Q594 53 596 52Q597 50 600 50L608 50Q611 50 612 52Q614 53 614 56ZM498 100Q498 121 483 135Q469 150 448 150Q427 150 413 135Q398 121 398 100Q398 79 413 65Q427 50 448 50Q469 50 483 65Q498 79 498 100ZM37 146L-12 7Q-12 5 -11 3Q-10 1 -8 0Q-7 0 -6 0L3 0Q7 0 8 4L45 109L82 4Q83 0 87 0L96 0Q99 0 100 2Q102 3 102 6Q102 6 102 7L53 146Q52 150 48 150L42 150Q38 150 37 146ZM266 150L258 150Q255 150 254 148Q252 147 252 144L252 56Q252 53 254 52Q255 50 258 50L266 50Q269 50 270 52Q272 53 272 56L272 56Q282 50 294 50Q311 50 324 62Q336 75 336 92L336 144Q336 147 334 148Q333 150 330 150L322 150Q319 150 318 148Q316 147 316 144L316 92Q316 83 310 76Q303 70 294 70Q285 70 278 76Q272 83 272 96L272 144Q272 147 270 148Q269 150 266 150ZM120 108Q120 117 126 124Q133 130 142 130Q151 130 158 124Q164 117 164 108L164 56Q164 53 166 52Q167 50 170 50L178 50Q181 50 182 52Q184 53 184 56L184 144Q184 147 182 148Q181 150 178 150L170 150Q167 150 166 148Q164 147 164 144L164 144Q154 150 142 150Q125 150 112 138Q100 125 100 108L100 56Q100 53 102 52Q103 50 106 50L114 50Q117 50 118 52Q120 53 120 56ZM374 150L366 150Q363 150 362 148Q360 147 360 144L360 6Q360 3 362 2Q363 0 366 0L374 0Q377 0 378 2Q380 3 380 6L380 144Q380 147 378 148Q377 150 374 150ZM222 150L214 150Q211 150 210 148Q208 147 208 144L208 6Q208 3 210 2Q211 0 214 0L222 0Q225 0 226 2Q228 3 228 6L228 144Q228 147 226 148Q225 150 222 150ZM478 100Q478 88 469 79Q460 70 448 70Q436 70 427 79Q418 88 418 100Q418 112 427 121Q436 130 448 130Q460 130 469 121Q478 112 478 100ZM594 100Q594 88 585 79Q576 70 564 70Q552 70 543 79Q534 88 534 100Q534 112 543 121Q552 130 564 130Q576 130 585 121Q594 112                 <circle cx="649" cy="71" r="13" fill="#d32f6a"/>
                <circle cx="649" cy="137" r="13" fill="#d32f6a"/>
            </svg>
        </a>
        <span id="version"></span>
    </footer>
</div>

<script>
    var VULNLOG_DATA = /*VULNLOG_DATA_PLACEHOLDER*/;
</script>
<script>
    'use strict';
    {
        const STATES = ['open', 'under_investigation', 'accepted', 'resolved', 'not_applicable'];
        const SEVERITIES = ['critical', 'high', 'medium', 'low'];
        const STATE_TONES = {open: 'open', resolved: 'positive', accepted: 'accepted', not_applicable: 'muted'};
        // Where an ID's advisory lives. An ID without a known prefix stays plain text.
        const ADVISORIES = {
            'CVE-': 'https://nvd.nist.gov/vuln/detail/',
            'GHSA-': 'https://github.com/advisories/',
            'SNYK-': 'https://security.snyk.io/vuln/',
            'RUSTSEC-': 'https://rustsec.org/advisories/',
        };

        const report = VULNLOG_DATA;
        // Empty lists and missing values are left out of the data, to keep the file small.
        const entries = report.entries || [];
        const byId = id => document.getElementById(id);

        /*
         * Builds an element. Children that are strings become text nodes, never HTML, so text from
         * the Vulnlog file can't add markup to the report.
         */
        function el(tag, attributes = {}, ...children) {
            const node = document.createElement(tag);
            for (const [name, value] of Object.entries(attributes)) {
                if (value != null) node.setAttribute(name, value);
            }
            node.append(...children.filter(child => child != null));
            return node;
        }

        // "not_applicable" reads as "Not applicable". The state under_investigation has a shorter label.
        function label(value) {
            if (value === 'under_investigation') return 'Investigating';
            const words = String(value).replace(/_/g, ' ');
            return words.charAt(0).toUpperCase() + words.slice(1);
        }

        /*
         * The colour of a row:
         *   resolved              green
         *   accepted              violet, never grey: an accepted risk is not a closed one
         *   not_applicable        grey
         *   open with a severity  the colour of the severity
         *   everything else       none
         */
        function toneOf(entry) {
            if (entry.state === 'open') return SEVERITIES.includes(entry.severity) ? entry.severity : null;
            return STATE_TONES[entry.state] || null;
        }

        function renderHeading() {
            const {name, organization, author} = report.project;
            document.title = `${name} - Vulnlog report`;
            byId('project-name').textContent = name;
            byId('byline').append(el('span', {}, organization), el('span', {}, author));
            if (report.vulnlogVersion) byId('version').textContent = report.vulnlogVersion;
        }

        function renderSource() {
            const inputs = report.inputs || [];
            const filter = filterParts(report.filter);
            byId('source').append(
                'Generated ', timestamp(report.generatedAt),
                inputs.length ? ` from ${inputs.join(', ')}. ` : '. ',
                filter.length
                    ? el('span', {class: 'filtered'}, el('b', {}, 'Filtered by'), ` ${filter.join(', ')}.`)
                    : 'Not filtered.');
        }

        // In the reader's language and time zone, short enough to sit in an English sentence: "13.11.2026, 20:31".
        function timestamp(iso) {
            const date = new Date(iso);
            const text = isNaN(date) ? iso : date.toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'});
            return el('time', {datetime: iso}, text);
        }

        function filterParts(filter = {}) {
            const part = (name, values) => values && values.length ? [`${name}=${values.join(',')}`] : [];
            return [
                ...part('as of', filter.asOf && [filter.asOf]),
                ...part('tags', filter.tags),
                ...part('reporter', filter.reporter && [filter.reporter]),
                ...part('state', filter.states),
                ...part('verdict', filter.verdicts),
                ...part('disposition', filter.dispositions),
            ];
        }

        /*
         * Each legend item knows which entries it stands for. A click on it shows only those rows,
         * and a second click shows all rows again.
         */
        function summaryItems() {
            const open = entry => entry.state === 'open';
            // All four severities always show: "Critical 0" is a message too.
            const severities = [
                ...SEVERITIES.map(severity => ({
                    name: label(severity),
                    tone: severity,
                    title: `open, ${severity} severity`,
                    matches: entry => open(entry) && entry.severity === severity,
                })),
                {
                    name: 'No severity',
                    title: 'open, no severity',
                    matches: entry => open(entry) && !SEVERITIES.includes(entry.severity),
                },
            ];
            // Known states always show, so the bar looks the same from report to report. Unknown ones follow.
            const states = [...STATES, ...new Set(entries.map(entry => entry.state).filter(state => !STATES.includes(state)))]
                .map(state => ({
                    name: label(state),
                    tone: STATE_TONES[state],
                    title: label(state).toLowerCase(),
                    matches: entry => entry.state === state,
                }));
            const counted = items => items.map(item => ({...item, count: entries.filter(item.matches).length}));
            return {
                severities: counted(severities).filter(item => item.tone || item.count),
                states: counted(states),
            };
        }

        function renderSummary(pick) {
            const {severities, states} = summaryItems();
            byId('open-count').textContent = entries.filter(entry => entry.state === 'open').length;
            byId('total').textContent = entries.length;
            return [...renderStack('open', severities, pick), ...renderStack('state', states, pick)];
        }

        // A stacked bar with one segment per item that occurs, and a legend with every item and its number.
        function renderStack(id, items, pick) {
            const stack = byId(`${id}-stack`);
            stack.setAttribute('aria-label', items.map(({name, count}) => `${count} ${name}`).join(', '));
            stack.append(...items.filter(item => item.count).map(({name, count, tone}) => {
                const segment = el('span', {'data-tone': tone, title: `${count} ${name}`});
                segment.style.flex = count;
                return segment;
            }));
            const keys = items.map(item => {
                const key = el('button', {class: 'key', type: 'button', 'data-tone': item.tone, 'aria-pressed': 'false'},
                    el('span', {class: 'dot'}), `${item.name} `, el('b', {}, String(item.count)));
                key.disabled = !item.count;
                key.addEventListener('click', () => pick(item));
                item.key = key;
                return key;
            });
            byId(`${id}-legend`).append(...keys);
            return items;
        }

        function renderEntries() {
            const rows = entries.map(entry =>
                el('tr', {'data-tone': toneOf(entry)}, idsCell(entry), stateCell(entry), detailsCell(entry), releasesCell(entry)));
            byId('entry-rows').append(...(rows.length ? rows
                : [el('tr', {}, el('td', {class: 'empty', colspan: '4'}, 'No vulnerability entries to display.'))]));
            return rows;
        }

        function idsCell(entry) {
            const aliases = (entry.ids || []).filter(id => id !== entry.primaryId);
            return el('td', {class: 'ids'}, advisoryLink(entry.primaryId), ...aliases.map(id => advisoryLink(id, 'alias')));
        }

        function advisoryLink(id, className) {
            const prefix = Object.keys(ADVISORIES).find(start => id.startsWith(start));
            return prefix
                ? el('a', {class: className, href: ADVISORIES[prefix] + id, target: '_blank', rel: 'noreferrer'}, id)
                : el('span', {class: className, style: 'display: block'}, id);
        }

        function stateCell(entry) {
            return el('td', {}, el('span', {class: 'badge', 'data-tone': STATE_TONES[entry.state]}, el('span', {class: 'dot'}), label(entry.state)));
        }

        function detailsCell(entry) {
            const assessment = [
                entry.verdict && label(entry.verdict),
                entry.severity && `${label(entry.severity)} severity`,
                entry.disposition && label(entry.disposition),
                entry.verdictDetail,
            ].filter(Boolean);
            const text = (name, value, className) =>
                value ? el('p', {class: className}, el('span', {class: 'label'}, name), value) : null;

            return el('td', {class: 'details'},
                assessment.length ? el('p', {class: 'assessment'}, ...assessment.map(part => el('span', {}, part))) : null,
                text('Description', entry.shortDescription),
                text('Analysis', entry.analysis, 'analysis'));
        }

        function releasesCell(entry) {
            const fixedIn = entry.fixedIn || [];
            return el('td', {'data-label': 'Releases'},
                (entry.releases || []).join(', '),
                fixedIn.length ? el('p', {class: 'fixed'}, el('span', {class: 'label'}, 'Fixed in'), fixedIn.join(', ')) : null);
        }

        // Folds every analysis longer than three lines, with a button to unfold it. Returns a way to set all of them.
        function foldAnalyses() {
            const analyses = [...document.querySelectorAll('.analysis')];
            analyses.forEach(analysis => analysis.classList.add('folded'));
            // Measures all of them first and changes the page after, so the browser lays it out only once.
            const long = analyses.filter(analysis => analysis.scrollHeight > analysis.clientHeight + 1);
            analyses.filter(analysis => !long.includes(analysis)).forEach(analysis => analysis.classList.remove('folded'));
            const folds = long.map(analysis => {
                const more = el('button', {class: 'text-button more', type: 'button'});
                const set = folded => {
                    analysis.classList.toggle('folded', folded);
                    more.setAttribute('aria-expanded', String(!folded));
                    more.textContent = folded ? 'Show more' : 'Show less';
                };
                more.addEventListener('click', () => set(!analysis.classList.contains('folded')));
                analysis.after(more);
                set(true);
                return set;
            });
            return folded => folds.forEach(set => set(folded));
        }

        /*
         * The filters of the table. A legend item picks a state or a severity, and the three lists pick a
         * release, a release with the fix, and a disposition. A row shows when it matches all of them.
         */
        function setUpFilters(rows) {
            const chosen = {legendItem: null, release: '', fixedIn: '', disposition: ''};
            const releaseOrder = (a, b) => a.localeCompare(b, undefined, {numeric: true});
            const valuesOf = field => [...new Set(entries.flatMap(entry => entry[field] || []))].sort(releaseOrder);

            const lists = [
                {id: 'pick-release', field: 'release', values: valuesOf('releases'),
                    matches: (entry, value) => (entry.releases || []).includes(value), describe: value => `affects ${value}`},
                {id: 'pick-fixed-in', field: 'fixedIn', values: valuesOf('fixedIn'),
                    matches: (entry, value) => (entry.fixedIn || []).includes(value), describe: value => `fixed in ${value}`},
                {id: 'pick-disposition', field: 'disposition',
                    values: [...new Set(entries.map(entry => entry.disposition || 'none'))].sort(),
                    matches: (entry, value) => (entry.disposition || 'none') === value,
                    describe: value => value === 'none' ? 'no disposition' : value},
            ];

            const legendItems = renderSummary(item => {
                chosen.legendItem = chosen.legendItem === item ? null : item;
                apply();
            });

            for (const list of lists) {
                const select = byId(list.id);
                select.append(...list.values.map(value =>
                    el('option', {value}, value === 'none' ? 'Not set' : list.field === 'disposition' ? label(value) : value)));
                // A list with nothing to choose from stays out of the way.
                select.parentElement.hidden = !list.values.length;
                select.addEventListener('change', () => {
                    chosen[list.field] = select.value;
                    apply();
                });
            }

            byId('clear').addEventListener('click', () => {
                chosen.legendItem = null;
                for (const list of lists) chosen[list.field] = byId(list.id).value = '';
                apply();
            });

            function apply() {
                const active = lists.filter(list => chosen[list.field]);
                let shown = 0;
                entries.forEach((entry, index) => {
                    const visible = (!chosen.legendItem || chosen.legendItem.matches(entry))
                        && active.every(list => list.matches(entry, chosen[list.field]));
                    rows[index].hidden = !visible;
                    if (visible) shown++;
                });
                legendItems.forEach(item => item.key.setAttribute('aria-pressed', String(item === chosen.legendItem)));

                const filters = [
                    ...(chosen.legendItem ? [chosen.legendItem.title] : []),
                    ...active.map(list => list.describe(chosen[list.field])),
                ];
                byId('showing').textContent = filters.length
                    ? `Showing ${shown} of ${entries.length} entries: ${filters.join(', ')}.`
                    : `Showing all ${entries.length} entries.`;
                byId('clear').classList.toggle('invisible', !filters.length);
            }

            apply();
        }

        renderHeading();
        renderSource();
        const rows = renderEntries();
        setUpFilters(rows);
        const setAllFolded = foldAnalyses();

        byId('collapse-all').addEventListener('click', () => byId('entries').classList.add('compact'));
        byId('expand-all').addEventListener('click', () => {
            byId('entries').classList.remove('compact');
            setAllFolded(false);
        });
    }
</script>
</body>
</html>
